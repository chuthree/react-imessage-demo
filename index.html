<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="用 React 复现 iMessage 的聊天界面与交互，支持照片、引用回复、回应和音效"
    />
    <link rel="canonical" href="https://imessage-demo.chu3.top/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="iMessage demo" />
    <meta
      property="og:description"
      content="An iMessage interface and interaction demo built with React, with English and Chinese support and system light and dark modes."
    />
    <meta property="og:url" content="https://imessage-demo.chu3.top/" />
    <meta property="og:image" content="https://imessage-demo.chu3.top/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="2400" />
    <meta property="og:image:height" content="1260" />
    <meta
      property="og:image:alt"
      content="iMessage demo showing photo sharing, threaded replies and reactions inside an iPhone frame"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      data-home-theme-color="light"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      data-home-theme-color="dark"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <title>iMessage demo</title>
    <script>
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.homeTheme = dark ? "dark" : "light";
      document.documentElement.classList.toggle("dark", dark);
      document.querySelector('link[rel="icon"]').href = dark
        ? "/favicon-dark.png"
        : "/favicon.png";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
