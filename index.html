<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta
      name="description"
      content="用 React 复现 iMessage 的聊天界面与交互，支持照片、引用回复、回应和音效"
    />
    <link rel="canonical" href="https://imessage-demo.chu3.top/" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta
      name="theme-color"
      data-home-theme-color="light"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      data-home-theme-color="dark"
      content="#000000"
      media="(prefers-color-scheme: dark)"
    />
    <title>iMessage demo</title>
    <script>
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.homeTheme = dark ? "dark" : "light";
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
